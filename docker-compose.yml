services:
  # --- DATABASE SERVICE: PostgreSQL ---
  db:
    image: postgres:16-alpine
    container_name: jobos_postgres
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-jobos}
      POSTGRES_USER: ${POSTGRES_USER:-jobos_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-jobos_secure_password_123}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-jobos_user} -d ${POSTGRES_DB:-jobos}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # --- BACKEND SERVICE: Django DRF + Gunicorn ---
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: jobos_backend
    restart: always
    command: >
      sh -c "python manage.py migrate &&
             gunicorn --bind 0.0.0.0:8000 --workers 3 jobos_config.wsgi:application"
    environment:
      SECRET_KEY: ${SECRET_KEY:-django-insecure-prod-key-jobos-12345}
      DEBUG: "False"
      ALLOWED_HOSTS: "*"
      DATABASE_URL: postgres://${POSTGRES_USER:-jobos_user}:${POSTGRES_PASSWORD:-jobos_secure_password_123}@db:5432/${POSTGRES_DB:-jobos}
      CORS_ALLOWED_ORIGINS: "http://localhost,http://localhost:3000,http://127.0.0.1"
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  # --- FRONTEND SERVICE: React SPA + Nginx Reverse Proxy ---
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: jobos_frontend
    restart: always
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  postgres_data:
